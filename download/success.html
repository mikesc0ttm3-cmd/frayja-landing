<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frayja Download Ready</title>
  <link rel="stylesheet" href="../style.css" />

  <style>
    body {
      background: #f5f7fa;
      font-family: system-ui, sans-serif;
    }

    .success-header {
      text-align: center;
      padding-top: 3rem;
      padding-bottom: 1rem;
    }

    .success-header h1 {
      font-size: 2.4rem;
      margin-bottom: 0.3rem;
    }

    .success-header .tagline {
      font-size: 1.1rem;
      color: #666;
    }

    .success-wrapper {
      display: flex;
      justify-content: center;
      padding: 2rem 1rem 4rem;
    }

    .success-card {
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      text-align: center;
    }

    .success-card h2 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .success-card .subtitle {
      color: #555;
      margin-bottom: 2rem;
    }

    .download-btn {
      width: 100%;
      padding: 0.9rem 1rem;
      background: #3652F6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration:none;
      
    }

    .download-btn:hover {
      background: #2d45d1;
    }

    .privacy-note {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #777;
    }
  </style>
</head>

<body>

  <header class="success-header">
    <h1>Frayja</h1>
    <p class="tagline">Private. Encrypted. Yours.</p>
  </header>

  <section class="success-wrapper">
    <div class="success-card">
      <h2>Your download is ready</h2>
      <p class="subtitle">Click below to download the Frayja desktop app.</p>

        <a class="download-btn"
          href="#" 
           onclick="startDownload(event)" >
            Download Frayja Vault for Windows
        </a>
      
      <p class="privacy-note">No tracking. No analytics. Just your download.</p>
    </div>
  </section>
  
<script>
  const params = new URLSearchParams(window.location.search);
  const redirect = params.get("redirect");

  // If subscribed and redirect exists, go to the article
  if (localStorage.getItem("frayja_subscribed") === "true" && redirect) {
    window.location.href = redirect;
  }
</script>

<script>
  async function startDownload(e) {
    e.preventDefault();   // Stop normal link behavior

    const apiUrl = "https://frayja.dev.vivetware.com/download?platform=windows&arch=x86_64&version=3.0.0";

    try {
        // Step 1: Get the real S3 presigned URL from your API
        const response = await fetch(apiUrl);
        const s3Url = await response.text();   // This gets the long Amazon URL you showed

        if (!s3Url || !s3Url.startsWith('http')) {
            alert("Failed to get download link");
            return;
        }

        // Step 2: Trigger the actual download with nice filename
        const link = document.createElement('a');
        link.href = s3Url.trim();
        link.download = "frayjavault Setup 1.0.0.exe";   // Clean filename
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

    } catch (err) {
        console.error(err);
        alert("Download failed. Please try again.");
    }
}
</script>

</body>
</html>
