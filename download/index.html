<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unlock Frayja Download</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <section class="download-container">
    <h1>Download Frayja</h1>
    <p>Enter your email to unlock the installer.</p>

    <form id="downloadForm" action="https://formspree.io/f/mnjzgoyg" method="POST">     
      <input type="email" name="email" placeholder="Email address" required />
      <button type="submit">Unlock Download</button>
    </form>
  </section>

  <script>
    // If user already unlocked, skip straight to success page
    if (localStorage.getItem("frayja_download_unlocked") === "true") {
      window.location.href = "success.html";
    }

    // After form submission, Formspree redirects to success.html
    document.getElementById("downloadForm").addEventListener("submit", () => {
      localStorage.setItem("frayja_download_unlocked", "true");
    });
  </script>

</body>
</html>
