<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Frayja</title>
  <link rel="stylesheet" href="../style.css" />

  <style>
    body {
      background: #f5f7fa;
      font-family: system-ui, sans-serif;
    }

    .download-header {
      text-align: center;
      padding-top: 3rem;
      padding-bottom: 1rem;
    }

    .download-header h1 {
      font-size: 2.4rem;
      margin-bottom: 0.3rem;
    }

    .download-header .tagline {
      font-size: 1.1rem;
      color: #666;
    }

    .download-wrapper {
      display: flex;
      justify-content: center;
      padding: 2rem 1rem 4rem;
    }

    .download-card {
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      text-align: center;
    }

    .download-card h2 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .download-card .subtitle {
      color: #555;
      margin-bottom: 2rem;
    }

    .download-input {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .download-submit {
      width: 100%;
      padding: 0.9rem 1rem;
      background: #3652F6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .download-submit:hover {
      background: #2d45d1;
    }

    .privacy-note {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #777;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header class="download-header">
    <h1>Download Frayja</h1>
    <p class="tagline">Private. Encrypted. Yours.</p>
  </header>

  <!-- Download Form -->
  <section class="download-wrapper">
    <div class="download-card">
      <h2>Unlock Your Download</h2>
      <p class="subtitle">Enter your email to access the Frayja desktop app.</p>

      <form id="downloadForm" action="https://usebasin.com/f/932b3cd969c0" method="POST">
        <input 
          type="email" 
          name="email" 
          placeholder="Email address" 
          required 
          class="download-input"
        />
        <button type="submit" class="download-submit">Unlock Download</button>
      </form>

      <p class="privacy-note">No tracking. No spam. Email used only to unlock your download.</p>
    </div>
  </section>

  <script>
    // If already unlocked, redirect to success page
    if (localStorage.getItem("frayja_download_unlocked") === "true") {
      window.location.href = "success.html";
    }
  </script>

</body>
</html>
