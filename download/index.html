<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unlock Frayja Download</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <section class="download-container">
    <h1>Download Frayja</h1>
    <p>Enter your email to unlock the installer.</p>
   
    <form id="downloadForm" action="https://usebasin.com/f/932b3cd969c0" method="POST">
      <input type="email" name="email" placeholder="Email address" required />
      <button type="submit">Unlock Download</button>
    </form>
  </section>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const subscribed = localStorage.getItem("frayja_subscribed") === "true";
      const unlocked = localStorage.getItem("frayja_download_unlocked") === "true";

      // Only skip the form if the user is subscribed AND already unlocked
      if (subscribed && unlocked) {
        window.location.href = "success.html";
      }
    });

    // When the unlock form is submitted, mark download as unlocked
    document.getElementById("downloadForm").addEventListener("submit", () => {
      localStorage.setItem("frayja_download_unlocked", "true");
    });
  </script>

</body>
</html>
