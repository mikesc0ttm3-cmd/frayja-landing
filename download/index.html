<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unlock Frayja Download</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

  <section class="download-container">
    <h1>Download Frayja</h1>
    <p>Enter your email to unlock the installer.</p>

    <form id="downloadForm" action="https://usebasin.com/f/64867" method="POST">
      <input type="email" name="email" placeholder="Email address" required />
      <button type="submit">Unlock Download</button>
    </form>
  </section>

  <script>
    // Skip the unlock form if the user already subscribed OR already unlocked
    if (
      localStorage.getItem("frayja_subscribed") === "true" ||
      localStorage.getItem("frayja_download_unlocked") === "true"
    ) {
      window.location.href = "success.html";
    }

    // When the unlock form is submitted, mark download as unlocked
    document.getElementById("downloadForm").addEventListener("submit", () => {
      localStorage.setItem("frayja_download_unlocked", "true");
    });
  </script>

</body>
</html>
